<!doctype html>
<html lang="en">
  <head>

      body {

  <body>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <!-- ── Stage / Sprite / easing ─────────────────────────────────────── -->
    <script type="text/babel">
      const Easing = {
        linear: (t) => t,
        easeInQuad: (t) => t * t,
        easeOutQuad: (t) => t * (2 - t),
        easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
        easeInCubic: (t) => t * t * t,
        easeOutCubic: (t) => --t * t * t + 1,
        easeInOutCubic: (t) =>
          t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1,
        easeInExpo: (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
        easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
        easeInOutExpo: (t) => {
          if (t === 0) return 0;
          if (t === 1) return 1;
          if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
          return 1 - 0.5 * Math.pow(2, -20 * t + 10);
        },
        easeInSine: (t) => 1 - Math.cos((t * Math.PI) / 2),
        easeOutSine: (t) => Math.sin((t * Math.PI) / 2),
        easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
        easeOutBack: (t) => {
          const c1 = 1.70158, c3 = c1 + 1;
          return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        },
        easeInBack: (t) => {
          const c1 = 1.70158, c3 = c1 + 1;
          return c3 * t * t * t - c1 * t * t;
        },
      };
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

      const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });
      const useTime = () => React.useContext(TimelineContext).time;
      const useTimeline = () => React.useContext(TimelineContext);
      const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
      const useSprite = () => React.useContext(SpriteContext);

      function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
        const { time } = useTimeline();
        const visible = time >= start && time <= end;
        if (!visible && !keepMounted) return null;
        const duration = end - start;
        const localTime = Math.max(0, time - start);
        const progress =
          duration > 0 && isFinite(duration) ? clamp(localTime / duration, 0, 1) : 0;
        const value = { localTime, progress, duration, visible };
        return (
          <SpriteContext.Provider value={value}>
            {typeof children === "function" ? children(value) : children}
          </SpriteContext.Provider>
        );
      }

      function Stage({
        width = 1280,
        height = 720,
        duration = 10,
        background = "#040810",
        loop = true,
        autoplay = true,
        persistKey = "fwstage",
        children,
      }) {
        const [time, setTime] = React.useState(() => {
          try {
            const v = parseFloat(localStorage.getItem(persistKey + ":t") || "0");
            return isFinite(v) ? clamp(v, 0, duration) : 0;
          } catch {
            return 0;
          }
        });
        const [playing, setPlaying] = React.useState(autoplay);
        const [hoverTime, setHoverTime] = React.useState(null);
        const [scale, setScale] = React.useState(1);
        const stageRef = React.useRef(null);
        const rafRef = React.useRef(null);
        const lastTsRef = React.useRef(null);

        React.useEffect(() => {
          try {
            localStorage.setItem(persistKey + ":t", String(time));
          } catch {}
        }, [time, persistKey]);

        React.useEffect(() => {
          if (!stageRef.current) return;
          const el = stageRef.current;
          const measure = () => {
            const barH = 44;
            const s = Math.min(el.clientWidth / width, (el.clientHeight - barH) / height);
            setScale(Math.max(0.05, s));
          };
          measure();
          const r1 = requestAnimationFrame(measure);
          const r2 = setTimeout(measure, 50);
          const r3 = setTimeout(measure, 200);
          const ro = new ResizeObserver(measure);
          ro.observe(el);
          window.addEventListener("resize", measure);
          return () => {
            cancelAnimationFrame(r1);
            clearTimeout(r2);
            clearTimeout(r3);
            ro.disconnect();
            window.removeEventListener("resize", measure);
          };
        }, [width, height]);

        React.useEffect(() => {
          if (!playing) {
            lastTsRef.current = null;
            return;
          }
          const step = (ts) => {
            if (lastTsRef.current == null) lastTsRef.current = ts;
            const dt = (ts - lastTsRef.current) / 1000;
            lastTsRef.current = ts;
            setTime((t) => {
              let next = t + dt;
              if (next >= duration) {
                if (loop) next = next % duration;
                else {
                  next = duration;
                  setPlaying(false);
                }
              }
              return next;
            });
            rafRef.current = requestAnimationFrame(step);
          };
          rafRef.current = requestAnimationFrame(step);
          return () => {
            if (rafRef.current) cancelAnimationFrame(rafRef.current);
            lastTsRef.current = null;
          };
        }, [playing, duration, loop]);

        React.useEffect(() => {
          const onKey = (e) => {
            if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA"))
              return;
            if (e.code === "Space") {
              e.preventDefault();
              setPlaying((p) => !p);
            } else if (e.code === "ArrowLeft") {
              setTime((t) => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
            } else if (e.code === "ArrowRight") {
              setTime((t) => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
            } else if (e.key === "0" || e.code === "Home") {
              setTime(0);
            }
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [duration]);

        const displayTime = hoverTime != null ? hoverTime : time;
        const ctxValue = React.useMemo(
          () => ({ time: displayTime, duration, playing, setTime, setPlaying }),
          [displayTime, duration, playing]
        );

        return (
          <div
            ref={stageRef}
            style={{
              position: "absolute",
              inset: 0,
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              background: "#000",
            }}
          >
            <div
              style={{
                flex: 1,
                width: "100%",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                overflow: "hidden",
                minHeight: 0,
              }}
            >
              <div
                style={{
                  width,
                  height,
                  background,
                  position: "relative",
                  transform: `scale(${scale})`,
                  transformOrigin: "center",
                  flexShrink: 0,
                  boxShadow: "0 20px 60px rgba(0,0,0,0.6)",
                  overflow: "hidden",
                }}
              >
                <TimelineContext.Provider value={ctxValue}>{children}</TimelineContext.Provider>
              </div>
            </div>
            <PlaybackBar
              time={displayTime}
              duration={duration}
              playing={playing}
              onPlayPause={() => setPlaying((p) => !p)}
              onReset={() => setTime(0)}
              onSeek={(t) => setTime(t)}
              onHover={(t) => setHoverTime(t)}
            />
          </div>
        );
      }

      function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
        const trackRef = React.useRef(null);
        const [dragging, setDragging] = React.useState(false);
        const timeFromEvent = React.useCallback(
          (e) => {
            const rect = trackRef.current.getBoundingClientRect();
            const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
            return x * duration;
          },
          [duration]
        );
        React.useEffect(() => {
          if (!dragging) return;
          const onUp = () => setDragging(false);
          const onMove = (e) => {
            if (!trackRef.current) return;
            onSeek(timeFromEvent(e));
          };
          window.addEventListener("mouseup", onUp);
          window.addEventListener("mousemove", onMove);
          return () => {
            window.removeEventListener("mouseup", onUp);
            window.removeEventListener("mousemove", onMove);
          };
        }, [dragging, timeFromEvent, onSeek]);
        const pct = duration > 0 ? (time / duration) * 100 : 0;
        const fmt = (t) => {
          const total = Math.max(0, t);
          const m = Math.floor(total / 60);
          const s = Math.floor(total % 60);
          const cs = Math.floor((total * 100) % 100);
          return `${m}:${String(s).padStart(2, "0")}.${String(cs).padStart(2, "0")}`;
        };
        const mono = "Geist Mono, ui-monospace, monospace";
        return (
          <div
            style={{
              display: "flex",
              alignItems: "center",
              gap: 12,
              padding: "8px 16px",
              background: "rgba(20,20,20,0.92)",
              borderTop: "1px solid rgba(255,255,255,0.08)",
              width: "100%",
              maxWidth: 680,
              alignSelf: "center",
              borderRadius: 8,
              color: "#f6f4ef",
              userSelect: "none",
              flexShrink: 0,
              fontFamily: "Geist, system-ui, sans-serif",
            }}
          >
            <IconButton onClick={onReset} title="Return to start">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
              </svg>
            </IconButton>
            <IconButton onClick={onPlayPause} title="Play/pause (space)">
              {playing ? (
                <svg width="14" height="14" viewBox="0 0 14 14">
                  <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
                  <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
                </svg>
              ) : (
                <svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 2l9 5-9 5V2z" fill="currentColor"/></svg>
              )}
            </IconButton>
            <div style={{ fontFamily: mono, fontSize: 12, fontVariantNumeric: "tabular-nums", width: 64, textAlign: "right" }}>
              {fmt(time)}
            </div>
            <div
              ref={trackRef}
              onMouseMove={(e) => {
                if (!trackRef.current) return;
                if (dragging) onSeek(timeFromEvent(e));
                else onHover(timeFromEvent(e));
              }}
              onMouseLeave={() => {
                if (!dragging) onHover(null);
              }}
              onMouseDown={(e) => {
                setDragging(true);
                onSeek(timeFromEvent(e));
                onHover(null);
              }}
              style={{ flex: 1, height: 22, position: "relative", cursor: "pointer", display: "flex", alignItems: "center" }}
            >
              <div style={{ position: "absolute", left: 0, right: 0, height: 4, background: "rgba(255,255,255,0.12)", borderRadius: 2 }}/>
              <div style={{ position: "absolute", left: 0, width: `${pct}%`, height: 4, background: "linear-gradient(90deg,#06b6d4,#3b82f6,#8b5cf6)", borderRadius: 2 }}/>
              <div style={{ position: "absolute", left: `${pct}%`, top: "50%", width: 12, height: 12, marginLeft: -6, marginTop: -6, background: "#fff", borderRadius: 6, boxShadow: "0 2px 4px rgba(0,0,0,0.4)" }}/>
            </div>
            <div style={{ fontFamily: mono, fontSize: 12, fontVariantNumeric: "tabular-nums", width: 64, textAlign: "left", color: "rgba(246,244,239,0.55)" }}>
              {fmt(duration)}
            </div>
          </div>
        );
      }

      function IconButton({ children, onClick, title }) {
        const [hover, setHover] = React.useState(false);
        return (
          <button
            onClick={onClick}
            title={title}
            onMouseEnter={() => setHover(true)}
            onMouseLeave={() => setHover(false)}
            style={{
              width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center",
              background: hover ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.04)",
              border: "1px solid rgba(255,255,255,0.1)", borderRadius: 6, color: "#f6f4ef",
              cursor: "pointer", padding: 0, transition: "background 120ms",
            }}
          >
            {children}
          </button>
        );
      }

      Object.assign(window, {
        Easing, clamp, useTime, useTimeline, Sprite, useSprite, Stage,
      });
    </script>

    <!-- ── Scenes (Feed WAVE Teaser) ───────────────────────────────────── -->
    <script type="text/babel">
      const W = 1920;
      const H = 1080;

      function SolanaLogo({ size = 220, opacity = 1, glow = 0 }) {
        return (
          <svg width={size} height={size * 0.78} viewBox="0 0 397 311" style={{
            display: "block", opacity,
            filter: glow ? `drop-shadow(0 0 ${glow}px rgba(20,241,149,.7))` : "none",
          }}>
            <defs>
              <linearGradient id="solx" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#00FFA3"/>
                <stop offset="50%" stopColor="#03E1FF"/>
                <stop offset="100%" stopColor="#DC1FFF"/>
              </linearGradient>
            </defs>
            <g fill="url(#solx)">
              <path d="M64.6 237.9c2.4-2.4 5.7-3.8 9.2-3.8h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1l62.7-62.7z"/>
              <path d="M64.6 3.8C67.1 1.4 70.4 0 73.8 0h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1L64.6 3.8z"/>
              <path d="M333.1 120.1c-2.4-2.4-5.7-3.8-9.2-3.8H6.5c-5.8 0-8.7 7-4.6 11.1l62.7 62.7c2.4 2.4 5.7 3.8 9.2 3.8h317.4c5.8 0 8.7-7 4.6-11.1l-62.7-62.6z"/>
            </g>
          </svg>
        );
      }

      function WaveLogoBig({ size = 320, drawProgress = 1, glow = 0 }) {
        const w = size, h = size * 0.72;
        const totalLen = 520;
        const dash = totalLen;
        const offset = totalLen * (1 - drawProgress);
        return (
          <svg width={w} height={h} viewBox="0 0 100 72" style={{
            display: "block",
            filter: glow ? `drop-shadow(0 0 ${glow}px rgba(59,130,246,.6))` : "none",
          }}>
            <defs>
              <linearGradient id="wavex" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stopColor="#06b6d4"/>
                <stop offset="50%" stopColor="#3b82f6"/>
                <stop offset="100%" stopColor="#8b5cf6"/>
              </linearGradient>
            </defs>
            <path
              d="M5 14 Q20 65, 35 36 Q50 12, 65 36 Q80 65, 95 14"
              stroke="url(#wavex)" strokeWidth="9" strokeLinecap="round" fill="none"
              pathLength={totalLen} strokeDasharray={dash} strokeDashoffset={offset}
            />
          </svg>
        );
      }

      function AmbientBG() {
        const t = window.useTime();
        const drift = Math.sin(t * 0.35) * 40;
        const drift2 = Math.cos(t * 0.28) * 60;
        return (
          <div style={{ position: "absolute", inset: 0, background: "#040810", overflow: "hidden" }}>
            <div style={{
              position: "absolute", left: "8%", top: "0%", width: 1100, height: 800,
              transform: `translate(${drift}px, ${drift2 * 0.5}px)`,
              background: "radial-gradient(closest-side, rgba(6,182,212,.28), transparent 70%)",
              filter: "blur(20px)",
            }}/>
            <div style={{
              position: "absolute", right: "0%", bottom: "0%", width: 1300, height: 900,
              transform: `translate(${-drift2 * 0.7}px, ${-drift * 0.4}px)`,
              background: "radial-gradient(closest-side, rgba(139,92,246,.32), transparent 70%)",
              filter: "blur(20px)",
            }}/>
            <div style={{
              position: "absolute", left: "40%", top: "30%", width: 800, height: 800,
              transform: `translate(${drift2 * 0.3}px, ${drift * 0.6}px)`,
              background: "radial-gradient(closest-side, rgba(59,130,246,.18), transparent 70%)",
              filter: "blur(30px)",
            }}/>
            <div style={{
              position: "absolute", inset: 0, opacity: 0.06, mixBlendMode: "overlay",
              backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>\")",
            }}/>
            <div style={{
              position: "absolute", inset: 0,
              background: "radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.55) 100%)",
              pointerEvents: "none",
            }}/>
          </div>
        );
      }

      function NeuralWeb({ entryStart = 0, holdEnd = 4, exitEnd = 5 }) {
        const t = window.useTime();
        const nodes = React.useMemo(() => {
          const arr = [];
          const seed = (i) => (Math.sin(i * 12.9898) * 43758.5453) % 1;
          for (let i = 0; i < 22; i++) {
            arr.push({
              x: 200 + ((seed(i) + 1) * 0.5) * 1520,
              y: 140 + ((seed(i + 99) + 1) * 0.5) * 800,
              r: 3 + ((seed(i + 7) + 1) * 0.5) * 4,
              ph: seed(i + 33),
            });
          }
          return arr;
        }, []);
        let env = 0;
        if (t < entryStart) env = 0;
        else if (t < holdEnd) env = window.Easing.easeOutCubic(window.clamp((t - entryStart) / 1.2, 0, 1));
        else if (t < exitEnd) env = 1 - window.Easing.easeInCubic(window.clamp((t - holdEnd) / (exitEnd - holdEnd), 0, 1));
        else env = 0;
        if (env <= 0.001) return null;
        return (
          <svg width={W} height={H} style={{ position: "absolute", inset: 0, opacity: env }}>
            <defs>
              <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stopColor="#00FFA3" stopOpacity=".0"/>
                <stop offset="50%" stopColor="#3b82f6" stopOpacity=".7"/>
                <stop offset="100%" stopColor="#DC1FFF" stopOpacity=".0"/>
              </linearGradient>
              <radialGradient id="nodeGrad">
                <stop offset="0%" stopColor="#fff" stopOpacity="1"/>
                <stop offset="40%" stopColor="#3b82f6" stopOpacity=".9"/>
                <stop offset="100%" stopColor="#3b82f6" stopOpacity="0"/>
              </radialGradient>
            </defs>
            {nodes.map((n, i) => {
              const others = nodes
                .map((m, j) => ({ j, d: Math.hypot(m.x - n.x, m.y - n.y) }))
                .filter((o) => o.j !== i)
                .sort((a, b) => a.d - b.d)
                .slice(0, 2);
              return others.map((o) => {
                const m = nodes[o.j];
                const flow = (Math.sin(t * 1.4 + i * 0.6) + 1) * 0.5;
                return (
                  <line key={`${i}-${o.j}`} x1={n.x} y1={n.y} x2={m.x} y2={m.y}
                    stroke="url(#lineGrad)" strokeWidth="1" opacity={0.25 + flow * 0.35}/>
                );
              });
            })}
            {nodes.map((n, i) => {
              const pulse = (Math.sin(t * 2.2 + n.ph * 6.28) + 1) * 0.5;
              const r = n.r * (0.9 + pulse * 0.6);
              const halo = n.r * (3 + pulse * 2.5);
              return (
                <g key={i}>
                  <circle cx={n.x} cy={n.y} r={halo} fill="url(#nodeGrad)" opacity={0.25 + pulse * 0.4}/>
                  <circle cx={n.x} cy={n.y} r={r} fill="#cfe9ff"/>
                </g>
              );
            })}
          </svg>
        );
      }

      function WaveFloor() {
        const t = window.useTime();
        const paths = [];
        for (let row = 0; row < 6; row++) {
          const yBase = 720 + row * 60;
          let d = `M -50 ${yBase}`;
          for (let x = -50; x <= W + 50; x += 30) {
            const y =
              yBase +
              Math.sin(x * 0.012 + t * 1.6 + row * 0.5) * (10 + row * 4) +
              Math.cos(x * 0.007 - t * 0.9 + row * 0.3) * (8 + row * 3);
            d += ` L ${x} ${y}`;
          }
          paths.push({ d, row });
        }
        return (
          <svg width={W} height={H} style={{ position: "absolute", inset: 0, opacity: 0.55 }}>
            <defs>
              <linearGradient id="wf" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stopColor="#06b6d4" stopOpacity="0"/>
                <stop offset="50%" stopColor="#3b82f6" stopOpacity="1"/>
                <stop offset="100%" stopColor="#8b5cf6" stopOpacity="0"/>
              </linearGradient>
            </defs>
            {paths.map((p, i) => (
              <path key={i} d={p.d} stroke="url(#wf)" strokeWidth={1.2 + i * 0.15} fill="none" opacity={0.15 + i * 0.08}/>
            ))}
          </svg>
        );

                <>

                    position: "absolute", left: "50%", top: 360, transform: "translateX(-50%)",

    </script>
